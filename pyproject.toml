[project]
name = "microdux"
version = "0.1.0"
description = "The Pollen Robotics Microduck locomotion tasks in JAX, ported from mjlab"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.35",
    "flax>=0.10.0",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    "playground>=0.2.0",
    "brax>=0.12.0",
    "mediapy>=1.2.0",
    "numpy>=1.26",
    "ml-collections>=1.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.35"]
warp = ["mujoco-mjx[warp]>=3.2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "scipy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microdux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
